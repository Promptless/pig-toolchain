name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  hub-workflow-smoke:
    uses: ./.github/workflows/pr-check.yml
    with:
      hub-root: tests/fixtures/hooks-hub
      test-command: python -m unittest discover -s tests -v
      test-runs-on: macos-latest
      test-python-version: "3.9"
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync dependencies
        run: uv sync --frozen

      - run: bash -n scripts/run.sh
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run ty
        run: uv run ty check src tests scripts --extra-search-path "${GITHUB_WORKSPACE}/src"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest tests -q -n auto --dist worksteal

  local-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync dependencies
        run: uv sync --frozen

      - run: uv run promptless-instruction-hub init --hub test-hub --org "Acme"
      - uses: ./
        with:
          mode: build
          hub-root: test-hub

  native-runtime:
    uses: ./.github/workflows/native-runtime.yml

  portable-hook-python-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Smoke test portable hook adapter on Python 3.9
        run: |
          python - <<'PY'
          import json, subprocess, sys
          runner = "src/promptless_instruction_hub/hook_runtime.py"
          script = "tests/fixtures/hooks-hub/assets/hooks/example/run.py"
          for host, event in [("claude", "SessionStart"), ("codex", "SessionStart"), ("cursor", "sessionStart")]:
              result = subprocess.run(
                  [sys.executable, runner, "--host", host, "--entrypoint", script],
                  input=json.dumps({"hook_event_name": event, "cwd": "/tmp/example"}),
                  capture_output=True, text=True, check=True,
              )
              output = json.loads(result.stdout)
              context = output["additional_context"] if host == "cursor" else output["hookSpecificOutput"]["additionalContext"]
              assert context == "session_start", output
          PY
