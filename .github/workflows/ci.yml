name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  hub-workflow-smoke:
    uses: ./.github/workflows/pr-check.yml
    with:
      hub-root: tests/fixtures/hooks-hub
      test-command: python -m unittest discover -s tests -v
      test-runs-on: macos-latest
      test-python-version: "3.9"
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync dependencies
        run: uv sync --frozen

      - run: bash -n scripts/run.sh
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run ty
        run: uv run ty check src tests scripts --extra-search-path "${GITHUB_WORKSPACE}/src"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest tests -q -n auto --dist worksteal

  local-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync dependencies
        run: uv sync --frozen

      - run: uv run promptless-instruction-hub init --hub test-hub --org Promptless
      - uses: ./
        with:
          mode: build
          hub-root: test-hub

  release-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up toolchain Python
        id: toolchain-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Build source distribution and wheel from source distribution
        env:
          TOOLCHAIN_PYTHON: ${{ steps.toolchain-python.outputs.python-path }}
        run: |
          rm -rf dist
          uv build --sdist --no-sources --python "$TOOLCHAIN_PYTHON" --out-dir dist
          uv build --wheel --no-sources --python "$TOOLCHAIN_PYTHON" --out-dir dist dist/*.tar.gz

      - name: Set up managed-runtime Python floor
        id: runtime-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Smoke test installed artifacts and generated runtime
        env:
          RUNTIME_PYTHON: ${{ steps.runtime-python.outputs.python-path }}
          TOOLCHAIN_PYTHON: ${{ steps.toolchain-python.outputs.python-path }}
        run: >-
          "$TOOLCHAIN_PYTHON" scripts/ci_managed_runtime_smoke.py artifacts
          --dist dist
          --uv "$(command -v uv)"
          --runtime-python "$RUNTIME_PYTHON"

      - name: Smoke test portable hook adapter on Python 3.9
        env:
          RUNTIME_PYTHON: ${{ steps.runtime-python.outputs.python-path }}
        run: |
          "$RUNTIME_PYTHON" - <<'PY'
          import json, subprocess, sys
          runner = "src/promptless_instruction_hub/hook_runtime.py"
          script = "tests/fixtures/hooks-hub/assets/hooks/example/run.py"
          for host, event in [("claude", "SessionStart"), ("codex", "SessionStart"), ("cursor", "sessionStart")]:
              result = subprocess.run(
                  [sys.executable, runner, "--host", host, "--entrypoint", script],
                  input=json.dumps({"hook_event_name": event, "cwd": "/tmp/example"}),
                  capture_output=True, text=True, check=True,
              )
              output = json.loads(result.stdout)
              context = output["additional_context"] if host == "cursor" else output["hookSpecificOutput"]["additionalContext"]
              assert context == "session_start", output
          PY

  managed-runtime-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up toolchain Python
        id: toolchain-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up managed-runtime Python floor
        id: runtime-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync dependencies
        run: uv sync --frozen --python "${{ steps.toolchain-python.outputs.python-path }}"

      - name: Smoke test generated runtime and Windows state lock
        run: >-
          uv run --frozen --python "${{ steps.toolchain-python.outputs.python-path }}"
          python scripts/ci_managed_runtime_smoke.py platform
          --runtime-python "${{ steps.runtime-python.outputs.python-path }}"
          --require-windows
