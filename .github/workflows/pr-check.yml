name: Instruction Hub PR Check

on:
  workflow_call:
    inputs:
      hub-root:
        description: Path to the Instruction Hub root.
        required: false
        type: string
        default: .
      mode:
        description: Action mode to run for PR checks.
        required: false
        type: string
        default: build
      test-command:
        description: Optional hub-owned behavioral test command. Empty skips the test job.
        required: false
        type: string
        default: ""
      test-runs-on:
        description: GitHub-hosted runner for the optional hub test job.
        required: false
        type: string
        default: ubuntu-latest
      test-python-version:
        description: Python version for the optional hub test job.
        required: false
        type: string
        default: "3.9"
    secrets:
      toolchain-token:
        description: Optional token with read access to a private toolchain repository. Defaults to github.token.
        required: false

jobs:
  hub-tests:
    if: ${{ inputs.test-command != '' }}
    runs-on: ${{ inputs.test-runs-on }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.test-python-version }}
      - name: Run hub tests
        working-directory: ${{ inputs.hub-root }}
        shell: bash
        env:
          HUB_TEST_COMMAND: ${{ inputs.test-command }}
        run: bash -e -o pipefail -c "$HUB_TEST_COMMAND"
  instruction-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Resolve toolchain source
        id: toolchain-ref
        shell: bash
        env:
          EXPECTED_WORKFLOW_PATH: .github/workflows/pr-check.yml
          JOB_WORKFLOW_REF: ${{ job.workflow_ref }}
        run: |
          set -euo pipefail

          if [[ -z "$JOB_WORKFLOW_REF" ]]; then
            echo "job.workflow_ref is unavailable; this reusable workflow requires GitHub.com workflow identity support." >&2
            exit 2
          fi
          if [[ "$JOB_WORKFLOW_REF" == *[[:cntrl:]]* ]]; then
            echo "Invalid reusable workflow identity: control characters are not allowed." >&2
            exit 2
          fi

          workflow_path="${JOB_WORKFLOW_REF%%@*}"
          toolchain_repository="${workflow_path%/"$EXPECTED_WORKFLOW_PATH"}"
          if [[ "$workflow_path" != "$toolchain_repository/$EXPECTED_WORKFLOW_PATH" ]] ||
             [[ ! "$toolchain_repository" =~ ^[A-Za-z0-9][A-Za-z0-9_-]*/[A-Za-z0-9_.-]+$ ]] ||
             [[ "${toolchain_repository#*/}" == . || "${toolchain_repository#*/}" == .. ]]; then
            echo "Invalid reusable workflow identity: expected owner/repository/$EXPECTED_WORKFLOW_PATH@ref." >&2
            exit 2
          fi

          toolchain_ref="${JOB_WORKFLOW_REF#*@}"
          if [[ ! "$toolchain_ref" =~ ^[0-9a-fA-F]{40}$ ]]; then
            case "$toolchain_ref" in
              refs/heads/*|refs/tags/*|refs/pull/*)
                if ! git check-ref-format "$toolchain_ref"; then
                  echo "Invalid reusable workflow Git ref." >&2
                  exit 2
                fi
                ;;
              *)
                echo "Invalid reusable workflow ref: expected a full branch/tag/pull ref or commit SHA." >&2
                exit 2
                ;;
            esac
          fi

          printf 'repository=%s\nref=%s\n' "$toolchain_repository" "$toolchain_ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ steps.toolchain-ref.outputs.repository }}
          ref: ${{ steps.toolchain-ref.outputs.ref }}
          token: ${{ secrets.toolchain-token || github.token }}
          path: .promptless-pig-toolchain
          persist-credentials: false
      - uses: ./.promptless-pig-toolchain
        with:
          mode: ${{ inputs.mode }}
          hub-root: ${{ inputs.hub-root }}
