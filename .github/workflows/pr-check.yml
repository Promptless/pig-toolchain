name: Instruction Hub PR Check

on:
  workflow_call:
    secrets:
      external-plugin-credentials:
        description: Repository-scoped read credentials for private external plugins (JSON).
        required: false
    inputs:
      hub-root:
        description: Path to the Instruction Hub root.
        required: false
        type: string
        default: .
      mode:
        description: Action mode to run for PR checks.
        required: false
        type: string
        default: build
      test-command:
        description: Optional hub-owned behavioral test command. Empty skips the test job.
        required: false
        type: string
        default: ""
      test-runs-on:
        description: GitHub-hosted runner for the optional hub test job.
        required: false
        type: string
        default: ubuntu-latest
      test-python-version:
        description: Python version for the optional hub test job.
        required: false
        type: string
        default: "3.9"

jobs:
  hub-tests:
    if: ${{ inputs.test-command != '' }}
    runs-on: ${{ inputs.test-runs-on }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.test-python-version }}
      - name: Run hub tests
        working-directory: ${{ inputs.hub-root }}
        shell: bash
        env:
          HUB_TEST_COMMAND: ${{ inputs.test-command }}
        run: bash -e -o pipefail -c "$HUB_TEST_COMMAND"
  instruction-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Resolve toolchain ref
        id: toolchain-ref
        shell: bash
        env:
          EXPECTED_WORKFLOW_PREFIX: Promptless/pig-toolchain/.github/workflows/pr-check.yml@
          JOB_WORKFLOW_REF: ${{ job.workflow_ref }}
        run: |
          set -euo pipefail

          if [[ "$JOB_WORKFLOW_REF" != "$EXPECTED_WORKFLOW_PREFIX"* ]]; then
            echo "Unexpected reusable workflow ref: $JOB_WORKFLOW_REF" >&2
            exit 2
          fi

          toolchain_ref="${JOB_WORKFLOW_REF#"$EXPECTED_WORKFLOW_PREFIX"}"
          if [[ -z "$toolchain_ref" ]]; then
            echo "Unable to resolve toolchain ref from job.workflow_ref." >&2
            exit 2
          fi

          printf 'ref=%s\n' "$toolchain_ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: Promptless/pig-toolchain
          ref: ${{ steps.toolchain-ref.outputs.ref }}
          path: .promptless-pig-toolchain
          persist-credentials: false
      - uses: ./.promptless-pig-toolchain
        with:
          mode: ${{ inputs.mode }}
          hub-root: ${{ inputs.hub-root }}
          external-plugin-credentials: ${{ secrets.external-plugin-credentials }}
